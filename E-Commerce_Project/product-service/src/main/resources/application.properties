spring.application.name=product-service
server.address=0.0.0.0
server.port=${PORT:8083}
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${PRODUCT_DB_URL:-jdbc:mysql://mysql:3306/product-service?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:-root}
spring.datasource.password=${DB_PASSWORD:-${MYSQL_ROOT_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true