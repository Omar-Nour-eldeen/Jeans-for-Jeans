spring.application.name=order-service
server.address=0.0.0.0
server.port=${PORT:8084}

spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://mysql:3306/order?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:${MYSQL_ROOT_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ───────── Spring RabbitMQ ─────────
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${SPRING_RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${SPRING_RABBITMQ_SSL_ENABLED:false}

# Connection / template settings
spring.rabbitmq.connection-timeout=10000
spring.rabbitmq.template.reply-timeout=5000

# ───────── Custom RabbitMQ Config ─────────
rabbitmq.exchange=shopflow.events


# Queues
rabbitmq.queues.order-placed=order.placed.queue
rabbitmq.queues.order-cancelled=order.cancelled.queue
rabbitmq.queues.payment-completed=payment.completed.queue
rabbitmq.queues.payment-failed=payment.failed.queue
rabbitmq.queues.payment-refunded=payment.refunded.queue
rabbitmq.queues.user-registered=user.registered.queue
rabbitmq.queues.password-reset=password.reset.queue
rabbitmq.queues.order-status-updated=order.status.updated.queue

# Routing Keys
rabbitmq.routing-keys.order-placed=order.placed
rabbitmq.routing-keys.order-cancelled=order.cancelled
rabbitmq.routing-keys.payment-completed=payment.completed
rabbitmq.routing-keys.payment-failed=payment.failed
rabbitmq.routing-keys.payment-refunded=payment.refunded
rabbitmq.routing-keys.user-registered=user.registered
rabbitmq.routing-keys.password-reset=password.reset
rabbitmq.routing-keys.order-status-updated=order.status.updated

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true



logging.level.com.order=DEBUG
logging.level.org.hibernate=WARN
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.rabbit=DEBUG

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

order.cancellation-window-minutes = 60
services.product-service=${PRODUCT_SERVICE_URL:https://jeans-product-abb55.containers.snapdeploy.app}
services.payment-service = ${PAYMENT_SERVICE_URL:http://localhost:8085}
