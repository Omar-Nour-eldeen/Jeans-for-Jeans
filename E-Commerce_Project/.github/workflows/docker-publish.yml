
name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Auth Service
        uses: docker/build-push-action@v6
        with:
          context: ./auth-service
          push: true
          tags: omarnoureldeen/auth-service:latest

      - name: Build and Push Cart Service
        uses: docker/build-push-action@v6
        with:
          context: ./cart-service
          push: true
          tags: omarnoureldeen/cart-service:latest

      - name: Build and Push Eureka Server
        uses: docker/build-push-action@v6
        with:
          context: ./eureka-server
          push: true
          tags: omarnoureldeen/eureka-server:latest

      - name: Build and Push Gateway
        uses: docker/build-push-action@v6
        with:
          context: ./gateway
          push: true
          tags: omarnoureldeen/gateway:latest

      - name: Build and Push Order Service
        uses: docker/build-push-action@v6
        with:
          context: ./order-service
          push: true
          tags: omarnoureldeen/order-service:latest

      - name: Build and Push Product Service
        uses: docker/build-push-action@v6
        with:
          context: ./product-service
          push: true
          tags: omarnoureldeen/product-service:latest

      - name: Build and Push User Service
        uses: docker/build-push-action@v6
        with:
          context: ./user-services
          push: true
          tags: omarnoureldeen/user-services:latest

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: omarnoureldeen/jeans-frontend:latest
