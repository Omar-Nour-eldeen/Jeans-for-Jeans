name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push-services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: auth-service
            context: ./E-Commerce_Project/auth-service
            image: omarnoureldeen/auth-service:latest
          - name: cart-service
            context: ./E-Commerce_Project/cart-service
            image: omarnoureldeen/cart-service:latest
          - name: eureka-server
            context: ./E-Commerce_Project/eureka-server
            image: omarnoureldeen/eureka-server:latest
          - name: gateway
            context: ./E-Commerce_Project/gateway
            image: omarnoureldeen/gateway:latest
          - name: order-service
            context: ./E-Commerce_Project/order-service
            image: omarnoureldeen/order-service:latest
          - name: product-service
            context: ./E-Commerce_Project/product-service
            image: omarnoureldeen/product-service:latest
          - name: user-services
            context: ./E-Commerce_Project/user-services
            image: omarnoureldeen/user-services:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ matrix.service.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./E-Commerce_Project/frontend
          push: true
          tags: omarnoureldeen/jeans-frontend:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
